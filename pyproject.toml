[project]
name = "ferrospot"
version = "0.1.0"
description = "Find iron nanoparticles in TEM / HAADF-STEM images and measure their sizes and spacings"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
keywords = ["tem", "haadf", "stem", "nanoparticles", "blob-detection", "space-weathering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
# Kept out of the core dependencies so the library stays small.
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
# Forward-model calibration (ferrospot.simulate, ferrospot.calibrate):
# polydisc packs the spheres (it brings numba), matplotlib draws figures.
simulate = [
    "matplotlib>=3.9",
    "polydisc>=0.4",
]

[project.scripts]
ferrospot = "ferrospot.cli:main"
ferrospot-dashboard = "ferrospot.dashboard:main"

[dependency-groups]
test = ["pytest>=8"]
# Pinned: new ruff versions enable new rules by default.
lint = ["ruff>=0.16.8,<0.17"]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "pydata-sphinx-theme>=0.16",
    "sphinx-autoapi>=3.6",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-bibtex>=2.6",
]

[tool.uv]
package = true
default-groups = ["test", "lint"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/ferrospot/__init__.py:__version__"]
# Stay on 0.x: breaking changes raise the minor version until 1.0.0 is
# chosen.
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
# Keeps the project's entry in uv.lock at the new version. The release
# action runs in a container of its own, which has no uv.
build_command = """
python -m pip install --quiet "uv>=0.8,<1"
uv lock --upgrade-package ferrospot
git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore",
    "style", "revert",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['Merge pull request #\d+', 'chore\(release\):']

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = ["data: needs the source PDFs and poppler-utils; skipped without them"]

[tool.uv.build-backend]
module-name = "ferrospot"
module-root = "src"

[build-system]
requires = ["uv_build >= 0.8.0, <0.13.0"]
build-backend = "uv_build"
